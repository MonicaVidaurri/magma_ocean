# ==============================================================================
# TRAPPIST-1e Configuration File
# Configuration version: 0.1.0
# ==============================================================================
[simulation]
# Primary numerical solver and integration settings
method = "BDF"
rtol = 1.0e-8
atol = 1.0e-12
start_time_years = 1.0
end_time_years = 8.0e9
tides_on = false

[numerical]
melt_grid_step = 5000.0            # 5km steps for mantle integration
degas_max_depth = 300000.0         # 300km limit for shallow degassing
degas_step_size = 1000.0           # 1km resolution for melt zones

# ==============================================================================
# Host Star Parameters (TRAPPIST-1 / M8V Dwarf)
# ==============================================================================
[star]
mass_star_relative = 0.0898         # 8.98% of Solar Mass
lum_star_relative = 0.000553        # 0.055% of Solar Luminosity (Bolometric)
host_radius = 8.291e7               # ~0.1192 R_sun (m)
spin_days = 3.295                   # Currently favored rotation period

[star.xuv]
# Fractional XUV luminosity (L_xuv / L_bol)
f_sat = 7.0e-4                      # Typical for TRAPPIST-1 (Wheatley et al. 2017)
decay_beta = -1.23                  # Ribas et al. decay slope
tsat_years = 1.0e9                  # M-dwarf saturation lasts ~1 Gyr
heating_efficiency = 0.15           # Standard hydrodynamic efficiency

# ==============================================================================
# Planet Bulk Parameters (TRAPPIST-1e)
# ==============================================================================
[planet]
albedo = 0.30                       # Bond albedo (Earth-like estimate)
radius_planet_relative = 0.92       # Measured (R_earth)
mass_planet_relative = 0.692        # Measured (M_earth)
radius_core_relative = 0.55         # Consistent with Earth-like iron core (Agol 2021)
core_mass_fraction = 0.32           # Earth-like mass fraction (~32%)
ocean_mass_multiplier = 2.0         # 2 Earth Oceans (TRAPPIST-1e is rockier than b/c/f/g)
initial_mantle_temp = 3000.0        # Post-impact magma ocean start
initial_spin_multiplier = 1.0       # Likely tidally locked very quickly

[planet.orbit]
initial_semi_major_axis = 0.02925   # (au)
initial_eccentricity = 0.1          # 

[planet.atmosphere.escape]
xuv_model = 1                       # Continuous decay
source_frac_H = 0.666               # H2O dissociation source (2/3 Hydrogen)
source_frac_O = 0.333               # (1/3 Oxygen)
diffusion_scaling = 4.8e19          # Scale for H-O drag models
