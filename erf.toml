# ==============================================================================
# Earth Configuration File
# ==============================================================================
[simulation]
version = "0.8d"  # simulation version just for tracking changes.
# Primary numerical solver and integration settings
method = "LSODA"
rtol = 3.0e-5
atol = 1.0e-6
start_time_years = 1.0
end_time_years = 1e+09
tides_on = false

[numerical]
melt_grid_step = 5000.0            # 5km steps for mantle integration
degas_max_depth = 300000.0         # 300km limit for shallow degassing
degas_step_size = 1000.0           # 1km resolution for melt zones

# ==============================================================================
# Host Star Parameters (Earth)
# ==============================================================================
[star]
mass_star_relative = 1
lum_star_relative = 1
host_radius = 1
spin_days = 25.67                   # Currently favored rotation period

[star.xuv]
# Fractional XUV luminosity (L_xuv / L_bol)
f_sat = 1.0e-5
decay_beta = -1.23
tsat_years = 1e8                    # 10 to 100 mya
heating_efficiency = 0.15           # Standard hydrodynamic efficiency

# ==============================================================================
# Planet Bulk Parameters (Earth)
# ==============================================================================
[planet]
albedo = 0.25                       # Bond albedo (Earth-like estimate)
radius_planet_relative = 1       # Measured (R_earth)
mass_planet_relative = 1        # Measured (M_earth)
radius_core_relative = 0.19         # Consistent with Earth-like iron core (Agol 2021)
core_mass_fraction = 0.16           # Earth-like mass fraction (~32%)
ocean_mass_multiplier = 1.0         # x Earth Oceans (TRAPPIST-1e is rockier than b/c/f/g)
initial_mantle_temp = 3000.0        # Post-impact magma ocean start
initial_spin_multiplier = 10.00

[planet.orbit]
initial_semi_major_axis = 1   # (au)
initial_eccentricity = 0.20

[planet.atmosphere.escape]
xuv_model = 1
source_frac_H = 0.666               # H2O dissociation source (2/3 Hydrogen)
source_frac_O = 0.333               # (1/3 Oxygen)
diffusion_scaling = 4.8e19          # Scale for H-O drag models
