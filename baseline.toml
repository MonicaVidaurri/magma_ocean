[planet]
# Bond albedo
albedo = 0.25
Rp_relative = 0.92     # relative to REarth
Rc_relative = 0.19     # relative to Rp
Mp_relative = 0.692    # relative to MEarth
core_fraction = 0.236
FeOt = 0.08
Earth_oceans = 2.0     # multiplier for 1.39e21 kg
mantle_temp_initial = 3000.0
spin_multiplier = 10.0 # Planet initial spin multiplier (x orbital motion)

[planet.orbit]
initial_semi_major_axis = 0.02925   # [AU
initial_eccentricity = 0.1

[star]
MStar_relative = 1.0   # relative to MSun
LStar_relative = 1.0   # relative to LSun
host_radius = 6.957e8  # meters
tsat_years = 1.0e9     # XUV saturation time
spin_days = 3.295 # Spin of star in Earth Days

[simulation]
method = "BDF"
rtol = 1.0e-8
atol = 1.0e-12
start_time_years = 1.0
end_time_years = 8.0e9
tides_on = false

[planet.atmosphere]
# Reference absorption coefficient for H2O (m^2/kg)
absorption_coeff_water = 0.01
# Gray infrared absorption coefficient (m^2/kg)
kappa_ir = 1e-5
# Diffusivity factor (mu) for two-stream approx
cos_theta = 0.5
# Critical temperature for water (K)
water_critical_temp = 647.0
# Vapor pressure coefficients for P = 10^(A - B/T) * 1e5 [Pa]
vapor_press_A = 6.079
vapor_press_B = 2261.10

[planet.atmosphere.escape]
xuv_model = 2          # 1=high, 2=low
# Binary diffusion scaling (SI units) 
# Derived from 4.8e17 * 100.0 (cm -> m conversion)
diffusion_scaling = 4.8e19    
# Water stoichiometry in the upper atmosphere
source_frac_H = 0.66666666666
source_frac_O = 0.33333333333

[planet.material]
density_mantle = 3300.0
# Olivine solid solution properties
fraction_forsterite = 0.9
fraction_fayalite = 0.1
molar_mass_forsterite = 0.14069    # kg/mol
molar_mass_fayalite = 0.20378      # kg/mol
# Specific heat of the bulk mantle (J/kg/K)
specific_heat_mantle = 1200.0
# Latent heat of fusion (J/kg)
latent_heat_fusion = 400000.0

# Specific heat of water vapor (J/kg/K)
specific_heat_h2o = 2000.0

[planet.volatiles]
# Water partitioning and solubility (MKS)
partition_coeff_water = 0.01      # kH2O
solubility_coeff_water = 3.44e-8  # s
solubility_exponent_water = 0.74  # n

[planet.thermodynamics]
specific_heat_mantle = 1200.0
thermal_expansion = 2e-5
thermal_conductivity = 4.2
heat_capacity = 1200.0        # cp (J/kg/K)
# Critical temperature for active magma ocean phase (K)
temp_solidus_static = 1373.0

# Mantle solidus/liquidus parameterization (Pressures evaluated in GPa)
solidus_slope_low_p = 104.42
solidus_intercept_low_p = 1420.0
solidus_slope_high_p = 26.53
solidus_intercept_high_p = 1825.0
liquidus_offset = 600.0

[planet.rheology]
# Parameters for: eta = A * exp(B / (T - T_ref))
liquid_visc_pre_exponential = 0.00024
liquid_visc_activation_temp = 4600.0
liquid_visc_ref_temp = 1000.0
# Parameters for: eta = A * exp(E / (R * T))
solid_visc_pre_exponential = 3.7489e9
solid_visc_activation_energy = 350000.0
# Critical crystal fraction for rheological breakdown (phi_c)
critical_crystal_fraction = 0.6
# Exponential weakening factor for melt in solid matrix
melt_weakening_factor = 26.0

[planet.rheology.sandu_2011]
# Empirical polynomial coefficients for ln(fH2O) (Li et al. 2008)
fugacity_poly_c0 = -7.9859
fugacity_poly_c1 = 4.3559
fugacity_poly_c2 = -0.5742
fugacity_poly_c3 = 0.0337

# Rheological parameters for wet olivine creep (Sandu et al. 2011)
visc_reference = 1.24e14      # Pa s
fugacity_exponent = 1.0       # r
activation_energy = 335000.0  # J/mol
activation_volume = 0.0       # m^3/mol

[planet.radiogenics]
# Age of the solar system / Reference time for concentrations (years)
age_solar_system = 4.6e9
# Bulk Uranium concentration (kg/kg)
bulk_uranium_concentration = 21.0e-9

# Isotope mass fractions relative to bulk Uranium
frac_238U = 0.9927
frac_235U = 0.0072
frac_40K = 1.28
frac_232Th = 4.01

# Specific heat production (W/kg)
heat_238U = 9.37e-5
heat_235U = 5.69e-4
heat_232Th = 2.69e-5
heat_40K = 2.79e-5

# Decay constants (1/years)
lambda_238U = 0.155e-9
lambda_235U = 0.985e-9
lambda_232Th = 0.0495e-9
lambda_40K = 0.555e-9

[planet.tides]
# Planet rheology settings (Standard Solid Mantle)
shear_modulus_solid = 60.0e9
shear_modulus_liquid_limit = 1.0e-5
rheology_model = "Andrade"
fixed_k2 = 0.3
fixed_Q = 3.0e7
obliquity = 0.0

# Shear Modulus Melting Model (e.g., Henning et al.)
crit_melt_frac = 0.5
melt_transition_width = 0.05
shear_melt_param_1 = 40000.0
shear_melt_param_2 = 25.0
shear_melt_falloff_slope = 700.0

# Reference Solidus/Liquidus for the transition temperature
temp_solidus_ref = 1420.0
temp_liquidus_ref = 1825.0

[planet.convection]
# Dimensionless melt fraction threshold for rheological transition
melt_fraction_threshold = 0.4 
# Nusselt scaling coefficient for hard-turbulent regime (Ra^1/3)
nusselt_coefficient = 0.089
# Geometric scaling factor for boundary layer instability/spreading
spreading_time_factor = 5.38


[planet.oxide_composition]
# --- Molar Masses (kg/mol) ---
# Note: These are converted from g/mol to keep the model strictly MKS
molar_mass_SiO2 = 0.060084
molar_mass_TiO2 = 0.079866
molar_mass_Al2O3 = 0.101961
molar_mass_MgO = 0.040304
molar_mass_CaO = 0.056078
molar_mass_Na2O = 0.061979
molar_mass_K2O = 0.094196
molar_mass_P2O5 = 0.141945
molar_mass_FeO = 0.071845
molar_mass_FeO1_5 = 0.0798445  # (0.159689 / 2.0)
molar_mass_O = 0.0159994

# --- Initial Mass Fractions (kg/kg) ---
# Defaulting to Bulk Silicate Earth (BSE)
mass_frac_SiO2 = 0.4597
mass_frac_TiO2 = 0.012
mass_frac_Al2O3 = 0.0477
mass_frac_MgO = 0.3666
mass_frac_CaO = 0.0378
mass_frac_Na2O = 0.0035
mass_frac_K2O = 0.0004
mass_frac_P2O5 = 0.002
mass_frac_FeOt = 0.08

# --- Initial Oxidation State ---
ratio_Fe3_to_total_Fe = 1e-12

[planet.oxygen_fugacity]
[planet.oxygen_fugacity.kress_carmichael_1991]
# --- Reference Constants ---
T0_ref = 1673.0
scaling_a = 0.196
constant_term = 6.675

# --- Temperature Dependencies ---
temp_coeff = -11492.0
temp_correction_coeff = 3.36

# --- Compositional Coefficients (d_i) ---
# Note: Signs are kept consistent with the analytical formula
coeff_Al2O3 = 2.243
coeff_FeOt  = 1.828
coeff_CaO   = -3.201
coeff_Na2O  = -5.854
coeff_K2O   = -6.215

# --- Pressure Dependencies ---
press_coeff_1 = 7.01e-7
press_coeff_2 = 1.54e-10
press_coeff_3 = -3.85e-17

[planet.oxygen_fugacity.borisov_2013]
# Empirical coefficients for alternative fO2 model
const_1 = 28144.0
const_2 = 13.95
coeff_MgO = 3905.0
coeff_CaO = -13359.0
coeff_NaO1_5 = -14858.0
coeff_KO1_5 = -9805.0
coeff_AlO1_5 = 10906.0
coeff_PO2_5 = 110971.0
coeff_Fe_diff = -11952.0

# Pressure dependence terms
p_term1_a = 33122.0
p_term1_b = 5.24
p_term1_c = 0.241

p_term2_a = 39156.0
p_term2_b = 6.17
p_term2_c = 0.132

[star.tides]
# Star rheology settings
viscosity = 1.0e10
shear_modulus = 1.0e7
rheology_model = "cpl"
fixed_k2 = 0.3
fixed_Q = 3.0e7
obliquity = 0.0
tidal_scale = 1.0

[star.xuv]
f_sat = 1e-3                  # XUV saturation fraction
decay_beta = -1.23            # Power-law decay exponent
heating_efficiency = 0.1      # eps (dimensionless)

[numerical]
degas_max_depth = 300000.0
degas_step_size = 1000.0
# Bisection solver constraints
max_iterations = 500
solver_tolerance = 1e-12
# Depth grid step size for magma ocean analysis (m)
melt_grid_step = 5000.0
# Number of atmospheric layers for Schwarzschild integration
olr_n_levels = 100
# Threshold for analytic vs numerical warning
tau_thick_threshold = 10.0
# Newton-Raphson settings for water partitioning
max_nr_iterations = 100
nr_solver_tolerance = 1e-10
# Brent's method safety epsilon
solver_epsilon = 1e-15

[constants]
# Seconds per year (MKS alignment)
seconds_per_year = 3.15569e7
# Gravitational Constant (m^3/kg/s^2)
G = 6.6743e-11
# Universal gas constant (J/mol/K)
gas_constant = 8.31447
# Molar mass of water (kg/mol)
molar_mass_H2O = 0.018015
# Stefan-Boltzmann constant (W/m^2/K^4)
stefan_boltzmann = 5.67e-8
# Standard 1 bar reference pressure (Pa)
pressure_ref = 101325.0
boltzmann = 1.380649e-23      # (J/K)
avogadro = 6.022e23           # (molecules/mol)
mass_proton = 1.6726e-27      # (kg)
solar_luminosity = 3.828e26   # (W)
molar_mass_H = 0.001008       # (kg/mol)
molar_mass_O = 0.0159994      # (kg/mol)
MSun = 1.989e30
LSun = 3.846e26
MEarth = 5.972e24
REarth = 6371000.0
AU = 1.496e11
Earth_ocean_mass = 1.39e21