# ==============================================================================
# Default Configuration File
# Planet configuration files (e.g., trappist1e.toml) override any of these values.
# ==============================================================================
[simulation]
version = "0.1"  # simulation version just for tracking changes.
# Primary numerical solver and integration settings
method = "BDF"
rtol = 1.0e-5
atol = 1.0e-8
start_time_years = 1.0
end_time_years = 8.0e9
tides_on = false
surface_temp_escape = false   # If true then the surface temperature plays a role in atmo escape via get_loss.py

[numerical]
# Grid and step sizes for physical evaluation
melt_grid_step = 5000.0             # Depth step for magma ocean integration (m)
degas_step_size = 1000.0            # Depth step for outgassing model (m)
degas_max_depth = 300000.0          # Max depth evaluated for degassing (m)

# Solver specific tolerances
max_iterations = 500                # Iteration limit for bisection solvers
solver_tolerance = 1.0e-12          # Error tolerance for bisection solvers
max_nr_iterations = 100             # Iteration limit for Newton-Raphson (water partitioning)
nr_solver_tolerance = 1.0e-10       # Error tolerance for Newton-Raphson
surface_temp_xtol = 1.0e-6          # Absolute tolerance of the surface temperature root find (K)
surface_temp_scan_points = 80       # Grid points used to bracket the hottest surface temperature root

# Mass balance iteration constraints
max_fixed_point_iters = 100         # Number of iterations to perform
fallback_iter_threshold = 50

[constants]
# Fundamental physics and conversion constants (Strictly MKS)
G = 6.6743e-11                      # Gravitational constant (m^3/kg/s^2)
gas_constant = 8.31447              # Universal gas constant (J/mol/K)
stefan_boltzmann = 5.67e-8          # Stefan-Boltzmann constant (W/m^2/K^4)
boltzmann = 1.380649e-23            # Boltzmann constant (J/K)
avogadro = 6.022e23                 # Avogadro's number (molecules/mol)
mass_proton = 1.6726e-27            # Proton mass (kg)
pressure_ref = 101325.0             # 1 bar reference pressure (Pa)
seconds_per_year = 3.15569e7        # Conversion factor

# Universal reference values
au = 1.496e11                       # Astronomical Unit (m)
mass_sun = 1.989e30                 # Solar mass (kg)
lum_sun = 3.846e26                  # Solar luminosity (W)
mass_earth = 5.972e24               # Earth mass (kg)
radius_earth = 6371000.0            # Earth radius (m)
mass_ocean_earth = 1.39e21          # Mass of 1 Earth Ocean (kg)

# Standard molar masses (kg/mol)
molar_mass_H2O = 0.018015
molar_mass_H = 0.001008
molar_mass_O = 0.0159994


# ==============================================================================
# Host Star Parameters
# ==============================================================================
[star]
mass_star_relative = 1.0            # Mass relative to mass_sun
lum_star_relative = 1.0             # Present-day luminosity relative to lum_sun (informational; the track is used)
host_radius = 6.957e8               # Physical radius (m)
spin_days = 3.295                   # Rotational period (Earth days)
stellar_track_file = "data/stellar_dataSun.txt"  # Bolometric luminosity vs age (see HOW_TO-make_stellardata.txt)

[star.xuv]
# X-ray and UV evolution track
tsat_years = 1.0e9                  # Time until XUV flux begins to decay (years)
f_sat = 1.0e-3                      # XUV saturation fraction (Lxuv / Lbol)
decay_beta = -1.23                  # Power-law decay exponent
heating_efficiency = 0.1            # Heating efficiency proxy (epsilon)

[star.tides]
# The star uses a constant phase lag (CPL) model.
fixed_k2 = 0.3                      # Tidal Love number
fixed_Q = 3.0e7                     # Tidal dissipation quality factor
obliquity = 0.0                     # Stellar obliquity (rad)
tidal_scale = 1.0                   # Fraction of the star participating in tides (folded into Q)
moi_factor = 0.07                   # I / (M R^2); ~0.07 for the Sun, ~0.2 for fully convective M dwarfs (BHAC15)


# ==============================================================================
# Planet Bulk Parameters
# ==============================================================================
[planet]
albedo = 0.25                       # Bond albedo
radius_planet_relative = 0.92       # Radius relative to radius_earth
mass_planet_relative = 0.692        # Mass relative to mass_earth
radius_core_relative = 0.19         # Core radius relative to the planet's radius
core_mass_fraction = 0.236          # Mass fraction of the core relative to total mass
ocean_mass_multiplier = 2.0         # Total initial water (relative to mass_ocean_earth)
initial_mantle_temp = 3000.0        # Starting potential temperature (K)
initial_spin_multiplier = 10.0      # Starting spin rate (multiplier of orbital frequency)
fixed_spin = false                  # Hold the planet's spin rate at its initial value (stand-in for an unmodeled torque)

[planet.orbit]
initial_semi_major_axis = 0.02925   # Initial orbital distance (au)
initial_eccentricity = 0.1          # Initial orbital eccentricity
fixed_eccentricity = false          # Hold e at its initial value (stand-in for forcing by other planets, e.g. an MMR)

[planet.radiogenics]
# Internal radioactive heat production
age_solar_system = 4.6e9            # Reference time for initial concentrations (years)
bulk_uranium_concentration = 21e-9  # Bulk concentration (kg/kg)

# Isotope mass fractions relative to bulk Uranium
frac_238U = 0.9927
frac_235U = 0.0072
frac_40K = 1.28
frac_232Th = 4.01

# Specific heat production (W/kg)
heat_238U = 9.37e-5
heat_235U = 5.69e-4
heat_232Th = 2.69e-5
heat_40K = 2.79e-5

# Decay constants (1/years)
decay_const_238U = 0.155e-9
decay_const_235U = 0.985e-9
decay_const_232Th = 0.0495e-9
decay_const_40K = 0.555e-9

[planet.oxide_composition]
# Bulk Silicate Earth (BSE) normalized molar masses (kg/mol)
molar_mass_SiO2 = 0.060084
molar_mass_TiO2 = 0.079866
molar_mass_Al2O3 = 0.101961
molar_mass_MgO = 0.040304
molar_mass_CaO = 0.056078
molar_mass_Na2O = 0.061979
molar_mass_K2O = 0.094196
molar_mass_P2O5 = 0.141945
molar_mass_FeO = 0.071845
molar_mass_FeO1_5 = 0.0798445       # Iron(III) equivalent: (0.159689 / 2.0)

# Initial bulk mass fractions (kg/kg)
mass_frac_SiO2 = 0.4597
mass_frac_TiO2 = 0.012
mass_frac_Al2O3 = 0.0477
mass_frac_MgO = 0.3666
mass_frac_CaO = 0.0378
mass_frac_Na2O = 0.0035
mass_frac_K2O = 0.0004
mass_frac_P2O5 = 0.002
mass_frac_FeO_total = 0.08          # Total iron content treated initially as FeO

# Initial Oxidation State
ratio_Fe3_to_total_Fe = 1.0e-12     # Highly reduced initial condition


# ==============================================================================
# Planet Physical Regimes
# ==============================================================================
[planet.thermodynamics]
# Bulk thermal properties
specific_heat_mantle = 1200.0       # Mantle specific heat (J/kg/K)
specific_heat_H2O = 2000.0          # Water vapor specific heat (J/kg/K)
latent_heat_fusion = 400000.0       # Mantle latent heat of fusion (J/kg)
thermal_expansion = 2.0e-5          # Bulk thermal expansion coefficient (1/K)
thermal_conductivity = 4.2          # Bulk thermal conductivity (W/m/K)

# Mantle melting curves (Pressures evaluated in GPa)
liquidus_offset = 600.0             # Difference between solidus and liquidus (K)
solidus_slope_low_p = 104.42        # dT/dP slope (low pressure)
solidus_intercept_low_p = 1420.0    # Solidus intercept (low pressure)
solidus_slope_high_p = 26.53        # dT/dP slope (high pressure)
solidus_intercept_high_p = 1825.0   # Solidus intercept (high pressure)
solidus_crossover_width_km = 30.0   # Tanh half-width for low/high-P solidus branch crossover (km)

[planet.volatiles]
partition_coeff_H2O = 0.01          # Distribution coefficient between solid and melt
solubility_coeff_H2O = 3.44e-8      # Empirical pre-exponential 's'
solubility_exponent_H2O = 0.74      # Empirical exponent 'n'

[planet.convection]
nusselt_coefficient = 0.089         # Nusselt scaling for hard-turbulent regime (Ra^1/3)
spreading_time_factor = 5.38        # Geometric scaling for boundary layer instability

[planet.rheology]
# Matrix viscosity: eta = A * exp(E / (R * T))
solid_visc_pre_exponential = 3.7489e9
solid_visc_activation_energy = 350000.0

# Melt viscosity: eta = A * exp(B / (T - T_ref))
liquid_visc_pre_exponential = 0.00024
liquid_visc_activation_temp = 4600.0
liquid_visc_ref_temp = 1000.0

# Multiphase modifiers
critical_crystal_fraction = 0.6     # Critical crystal fraction for rheological breakdown (also sets the liquid layer)
melt_weakening_factor = 26.0        # Exponential weakening factor for melt in solid matrix

# Shear Modulus Melt Fraction Softening
solid_shear_modulus = 60.0e9        # Solid shear modulus (Pa)
liquid_shear_modulus = 1000.0       # Liquid shear modulus (Pa)
melt_transition_width = 0.05        # Break down duration
shear_solid_softening = 8.0         # How much the shear breaks down during the transition.

[planet.tides]
# Planetary tidal dissipation properties (solid-like mantle layer below the rheological transition)
rheology_model = "Andrade"          # Any TidalPy rheology_x model name
love_method = "radial_solver"       # "radial_solver" (full layered response, ~15x slower run) or "homogeneous" (fast)
max_degree_l = 2                    # Maximum tidal harmonic degree
eccentricity_truncation = 20        # Eccentricity function truncation (TidalPy: 2, 4, 6, 8, 10, 20, 50)
obliquity_truncation = 0            # Obliquity function truncation (0 when obliquity is 0)
obliquity = 0.0                     # Planetary obliquity (rad)
min_solid_layer_thickness = 1.0     # Solid layers thinner than this (m) are treated as non-dissipative

[planet.tides.structure]
# Self-compressed interior used for the tidal response (TidalPy EOS solve). Third-order Birch-Murnaghan layers; the
# core and mantle reference densities are calibrated so the solved layer masses match the core and mantle masses.
core_bulk_modulus = 1.097e11        # Liquid iron reference bulk modulus (Pa; Anderson & Ahrens 1994)
core_bulk_modulus_derivative = 4.66 # Liquid iron dK/dP
mantle_bulk_modulus = 1.30e11       # Silicate reference bulk modulus (Pa)
mantle_bulk_modulus_derivative = 4.5
magma_density_contrast = 0.05       # (rho_solid - rho_magma) / rho_solid at equal pressure; the static magma layer's
                                    # load on the solid below grows with this contrast
min_magma_layer_thickness = 1000.0  # Magma layers thinner than this (m) are omitted (the solid reaches the surface)


# ==============================================================================
# Atmosphere & Fugacity Modules
# ==============================================================================
[planet.atmosphere]
# Radiative properties
absorption_coeff_H2O = 0.01         # Reference absorption coefficient for water vapor (m^2/kg)
absorption_coeff_O2 = 1.0e-5        # Reference absorption coefficient for oxygen (m^2/kg) O2 is a weak greenhouse gas (Collision-Induced Absorption / Rayleigh scattering)

# Condensation limits
critical_temp_H2O = 647.0           # Critical temperature for water (K)
vapor_press_a = 6.079               # Empirical vapor pressure coefficient A
vapor_press_b = 2261.10             # Empirical vapor pressure coefficient B

[planet.atmosphere.escape]
xuv_model = 2                       # 1 = High, 2 = Low
diffusion_scaling = 4.8e19          # Binary diffusion scaling (SI units)
source_frac_H = 0.66666666666       # Stoichiometric ratio in the upper atmosphere
source_frac_O = 0.33333333333       # Stoichiometric ratio in the upper atmosphere
taper_pressure = 1.0                # Escape scales by W / (|W| + W_taper), W_taper = water column of this pressure (Pa)

[planet.oxygen_fugacity.kress_carmichael_1991]
# Empirical coefficients for Kress & Carmichael (1991) fO2 model
temp_ref = 1673.0
scaling_a = 0.196
constant_term = 6.675
temp_coeff = -11492.0
temp_correction_coeff = 3.36
coeff_Al2O3 = 2.243
coeff_FeO = 1.828                   # Original was FeOt, standardized to FeO for consistency
coeff_CaO = -3.201
coeff_Na2O = -5.854
coeff_K2O = -6.215
press_coeff_1 = 7.01e-7
press_coeff_2 = 1.54e-10
press_coeff_3 = -3.85e-17
